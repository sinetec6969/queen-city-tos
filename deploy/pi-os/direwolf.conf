# Queen City node: direwolf for a Pi 4 + Digirig Mobile + Baofeng UV-5R.
# Replace YOURCALL. Check the sound card name with `arecord -l` (the Digirig's
# CM108 usually shows up as "Device"). Tune TXDELAY on the air (see README).
ADEVICE plughw:CARD=Device,DEV=0
ACHANNELS 1
CHANNEL 0
MYCALL YOURCALL-5
MODEM 1200
# The Digirig keys the radio with RTS on its serial port.
PTT /dev/ttyUSB0 RTS
# UV-5R TX->RX switching is slow: 400 ms is a safe start (30-50 = 300-500 ms).
TXDELAY 40
TXTAIL 10
SLOTTIME 10
PERSIST 63
# Kernel AX.25 talks to direwolf through the KISS pty it makes with -p.
KISSPORT 0
AGWPORT 0
