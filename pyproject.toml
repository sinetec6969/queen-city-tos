[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queen-city-tos"
version = "0.7.0"
description = "Queen City: Terms of Service - a turn-based terminal RPG set in Charlotte, 2027"
requires-python = ">=3.10"
dependencies = ["textual>=0.80", "pyyaml>=6"]

[project.scripts]
qcts = "tos.ui.app:main"
qcts-line = "tos.line.__main__:main"

[tool.setuptools.packages.find]
include = ["tos*"]

[tool.setuptools.package-data]
tos = ["data/*.yaml", "data/*.txt", "data/locations/*.yaml", "data/dialogues/*.yaml"]
