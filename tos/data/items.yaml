# Weapons: melee or ranged. ap = cost per attack. dmg = [min, max]. acc = flat hit bonus.
fists:
  name: Fists
  type: weapon
  melee: true
  ap: 3
  dmg: [1, 3]
  range: 1
  desc: "Ten fingers, two thumbs, ninety-four days of pent-up feelings."

tire_iron:
  name: Tire Iron
  type: weapon
  melee: true
  ap: 3
  dmg: [4, 7]
  acc: 5
  range: 1
  desc: "Teo's. He bought it to learn to change a flat. He never learned."

nail_gun:
  name: Nail Gun
  type: weapon
  melee: false
  ap: 4
  dmg: [4, 7]
  range: 6
  ammo: nails
  desc: "Cordless, industrial, and blissfully offline."

nails:
  name: Nails
  type: ammo
  desc: "Framing nails. Ammunition, now."

sweet_tea:
  name: Sweet Tea (gallon)
  type: aid
  heal: 15
  use_text: "You drink sweet tea straight from the jug. Your blood sugar files a complaint. You feel great."
  desc: "Heals 15 HP. The Concierge decided you're a sweet tea person. It was right."

med_gummy:
  name: Med-Gummy
  type: aid
  heal: 8
  use_text: "You chew a med-gummy. It tastes like a pharmacy's idea of a strawberry."
  desc: "Heals 8 HP."

tinfoil:
  name: Tinfoil
  type: aid
  signal: -30
  use_text: "You line your cap with tinfoil. You were right all along. It doesn't make it better."
  desc: "Lowers Signal by 30. Yes, really."

faraday_drive:
  name: Faraday Pouch
  type: key
  desc: "A silver pouch, heavy as a brick, sealed with electrical tape. A hard drive inside, pulled from something the Concierge owns. It's for Mags."

thermite:
  name: Thermite Charge
  type: key
  desc: "A taped brick with a pull tab and SORRY written on it in marker. Tape it to the relay's main bus bar, pull, walk away. Don't run."

breaker_bar:
  name: Breaker Bar
  type: weapon
  melee: true
  ap: 3
  dmg: [6, 9]
  acc: 5
  range: 1
  desc: "Two feet of chrome-moly steel for loosening lug nuts that don't want to move. Neither does anything you hit with it."

nailer_mk2:
  name: Ruth's Nailer
  type: weapon
  melee: false
  ap: 3
  dmg: [5, 8]
  acc: 10
  range: 6
  ammo: nails
  desc: "Ruth rebuilt it with a lighter trigger and a longer barrel and scratched SORRY into the grip. Fires faster than the stock nail gun and hits what you point it at."

rocket_tea:
  name: Rocket Tea
  type: aid
  heal: 25
  use_text: "Sweet tea, reduced on a camp stove to something closer to syrup, with three espresso shots. Your heart files a formal objection. You feel invincible."
  desc: "Heals 25 HP. Doc says one a day. Doc says a lot of things."

service_badge:
  name: Service Badge
  type: key
  desc: "A driver's badge on a lanyard: CONCIERGE LOGISTICS, ALL FLOORS. The photo is of a man who was never required."

# ---- junk: crafting ingredients (machines drop them) ----
scrap:
  name: Scrap
  type: junk
  desc: "Bent brackets, sheet metal, a servo that still twitches. Craftable."
wire:
  name: Wire
  type: junk
  desc: "A coil of copper wire, stripped out of something that used to deliver things. Craftable."
duct_tape:
  name: Duct Tape
  type: junk
  desc: "Silver, sticky, load-bearing. Craftable."
sugar:
  name: Sugar
  type: junk
  desc: "A five-pound bag of sugar. In this economy. Craftable."

tinfoil_hat:
  name: Tinfoil Hat
  type: aid
  signal: -50
  use_text: "You put on the hat. It is the most dignified thing you have ever worn, given the circumstances."
  desc: "Lowers Signal by 50. Crafted."
