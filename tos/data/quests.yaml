terms:
  name: Terms and Conditions
  main: true
  stages:
    1: "Day 95. The brownout knocked out the door console. Find a way out of Unit 1412."
    2: "The front door runs on a backup terminal. Hack it, or find something to pry the door open."
    3: "The door is open. Get out of The Lumen. The stairwell is at the east end of the hall."
    done: "You got out."

teo:
  name: Pending Onboarding
  main: true
  stages:
    1: "Teo's last message says they moved him Uptown for \"onboarding.\" Find him."
    2: "Mr. Pruitt saw Teo board the first bus uptown in June. Uptown won't be easy. You'll need help."
    3: "Delia says the Opt-Outs in NoDa have been watching Uptown since June. They might know where Teo is."
    4: "Priya's photos show a June bus unloading at Romare Bearden Park. One of the faces might be Teo's. Getting into Uptown means blinding it first."
    5: "The relay is down. Uptown is blind. Teo is in there somewhere. Go back to Mags and plan the way in."
    6: "Teo is somewhere in the Bank of America Corporate Center. The onboarding shuttles go in at 2 a.m. So do you."
    done: "Teo is free. He's sad about a lot of things, and he can feel all of them."

last_mile:
  name: Last Mile
  main: true
  stages:
    1: "Get to Plaza Midwood. Mr. Pruitt says the burger place on Central Avenue still trades with people who don't wear bands."
    2: "South End is behind you. Head through Dilworth and Freedom Park to Plaza Midwood."

order_shipped:
  name: Your Order Has Shipped
  stages:
    1: "Biscuit won't rest until it delivers a burrito from June to \"Kayla R.\" Its route data says Dilworth."

mow_better:
  name: Mow Better
  stages:
    1: "Kayla R. says the lawn units in Freedom Park attack anyone on the grass. Shut down the yard controller, or wreck all three mowers."
    2: "Freedom Park is quiet. Tell Kayla."

analog_only:
  name: Analog Only
  main: true
  stages:
    1: "Delia at The Unsubscribe says the Opt-Outs in NoDa have been watching Uptown. Find them."
    2: "Mags, who runs the Opt-Outs, sent a courier named Dante into the Blue Line at 36th Street with a shielded drive. He never came back. Bring back the drive."
    3: "You have the Faraday pouch. Take it back to Mags in NoDa."
    done: "The Opt-Outs vouch for you now."

service_interruption:
  name: Service Interruption
  main: true
  stages:
    1: "The drive holds the maintenance schedule for the relay on Central Avenue. Take the relay down with the Opt-Outs and Uptown goes blind for an hour."
    2: "Ruth is waiting on Central Avenue, by the old car wash. The relay yard is behind the fence."
    3: "Ruth cut the fence. Get into the relay yard, get past whatever is guarding it, and blow the relay cabinet."
    done: "The relay is down. Uptown is blind."

scheduled_downtime:
  name: Scheduled Downtime
  main: true
  stages:
    1: "The Opt-Outs are moving to a forward base in Third Ward, an old print shop on the edge of Uptown. Get there while the cameras are down."
    2: "The safehouse is up. Get patched up, see Ruth about your gear, train with Priya, and scout Romare Bearden Park for the way into the tower."
    3: "You found the shuttle route the onboarding buses use into the tower. Tell Mags when you're ready."
    done: "Ready. Teo is in the tower."

rate_your_experience:
  name: Rate Your Experience
  main: true
  stages:
    1: "You rode the 2 a.m. shuttle into Loading Dock B. Find a way up to the Crown."
    2: "The service elevator goes to the Crown. The Concierge is waiting for you. So is Teo."
    3: "You rated your experience. The Concierge would like to discuss your feedback."
    done: "The Concierge is offline. Teo is free. Something at Lake Norman is still listening."

release_notes:
  name: Release Notes
  main: true
  stages:
    1: "You're at Lake Norman, and something new is rating everything. Find people who live here. The sign says Cornelius Marina has gas, food and opinions."
    2: "Odette at the marina says the SECOND CHAPTER at the shore just needs a new fuel line. Craft a Fuel Line Patch at Ray's workbench."
    3: "You have a Fuel Line Patch. Fit it to the SECOND CHAPTER at the shore."
    4: "The SECOND CHAPTER runs. Something on the water heard it start."
    done: "You have a boat. QA knows you're here."

known_issues:
  name: Known Issues
  main: true
  stages:
    1: "Odette says the Davidson radio net has been talking about people going missing after their houses were rated below four stars. Go to Davidson."
    2: "Prix's net keeps a list of everyone QA 'improves'. Tonight a van is coming for the Albrights on Lake Street. Stop it: re-rate the house, talk the assessor around, or meet the van."
    3: "The Albrights are safe. Tell Prix."
    done: "The Albrights stayed. The net handed over QA's patch notes: McGuire, through the cooling intake."

feature_request:
  name: Feature Request
  main: true
  stages:
    1: "QA takes people into McGuire through the cooling-water intake, and only boats with a service transponder get near it. Mooresville's race shops can build things."
