# Travel maps. Each node sits on one region's canvas (x, y; 52 x 15). `region` defaults to charlotte.
# location/spawn: where entering the node puts you. Nodes without a location are not built yet.
# goto: <node>: a gateway; picking it switches to that node's region map (see engine/travel.py).
width: 52
height: 15
regions:
  charlotte:
    name: CHARLOTTE
    width: 52
    height: 15
    encounter_chance: 0.15
    flavor: "You're on the street. The air smells like ozone and somebody's grill."
  lake_norman:
    name: LAKE NORMAN
    width: 52
    height: 15
    encounter_chance: 0.25
    flavor: "The lake steams in the cold. Somewhere out on the water, a boat motor coughs twice and gives up."
nodes:
  south_end:
    name: SOUTH END
    x: 9
    y: 12
    location: south_end_street
    spawn: east
    blurb: "Onboarded zone. Spotless, silent, high Signal. Home, unfortunately."
  dilworth:
    name: DILWORTH
    x: 22
    y: 13
    unlocked_if: {flag: act1_done}
    location: dilworth
    spawn: west
    blurb: "Old bungalows and Freedom Park. The lawn units have opinions now."
  plaza_midwood:
    name: PLAZA MIDWOOD
    x: 35
    y: 9
    unlocked_if: {flag: reached_midwood}
    location: plaza_midwood
    spawn: city
    blurb: "The Midwood Exchange at The Unsubscribe. Unbanded humans. Mostly-beef burgers."
  central_ave:
    name: CENTRAL AVE
    x: 26
    y: 7
    unlocked_if: {quest: service_interruption, gte: 2}
    location: central_ave
    spawn: city
    blurb: "A relay tower on Central keeps Uptown's eyes open."
  noda:
    name: NODA
    x: 31
    y: 3
    unlocked_if: {flag: reached_midwood}
    location: noda
    spawn: city
    blurb: "The Opt-Outs, in a dead brewery. Analog only. Bring proof."
  blue_line:
    name: LYNX BLUE LINE
    x: 13
    y: 4
    unlocked_if: {quest: analog_only, gte: 2}
    location: lynx_36th
    spawn: city
    blurb: "Stalled trains since June. Something is still riding them."
  uptown:
    name: UPTOWN
    x: 17
    y: 8
    unlocked_if: {flag: relay_down}
    location: third_ward
    spawn: city
    blurb: "The Concierge's campus. You can see the Crown from anywhere."
  speedway:
    name: SPEEDWAY
    x: 41
    y: 1
    unlocked_if: {flag: reached_midwood}
    blurb: "The Infield. Raiders racing stolen robotaxis in Concord."
  lake_norman:
    name: LAKE NORMAN
    x: 3
    y: 1
    unlocked_if: {flag: chapter2}
    goto: ln_shore
    travel_text: "North on I-77, past the exits nobody takes anymore. The lake comes up on your left, steaming."
    blurb: "Chapter 2. The lake runs warm near McGuire now."
  # ---- Lake Norman region (chapter two) ----
  ln_shore:
    name: THE SHORE
    region: lake_norman
    x: 30
    y: 12
    unlocked_if: {flag: chapter2}
    location: lake_norman
    spawn: city
    blurb: "Where the road meets the water. Warm water, in November."
  cornelius:
    name: CORNELIUS
    region: lake_norman
    x: 38
    y: 10
    unlocked_if: {flag: chapter2}
    location: cornelius_marina
    spawn: road
    blurb: "Marinas and lake houses. Somebody's generator is running."
  davidson:
    name: DAVIDSON
    region: lake_norman
    x: 42
    y: 13
    unlocked_if: {flag: has_boat}
    location: davidson_main
    spawn: dock
    blurb: "A college town that kept its library open, mostly out of spite."
  mooresville:
    name: MOORESVILLE
    region: lake_norman
    x: 36
    y: 3
    unlocked_if: {flag: has_boat}
    blurb: "Race shops. Every garage door is open and every engine is cold."
  state_park:
    name: STATE PARK
    region: lake_norman
    x: 20
    y: 1
    unlocked_if: {flag: has_boat}
    blurb: "Trails, campsites, and a ranger station with its lights on."
  the_islands:
    name: THE ISLANDS
    region: lake_norman
    x: 26
    y: 7
    unlocked_if: {flag: has_boat}
    blurb: "Little islands in the middle of the lake. Boats only."
  mcguire:
    name: MCGUIRE STATION
    region: lake_norman
    x: 10
    y: 12
    unlocked_if: {flag: has_boat}
    blurb: "The cooling towers breathe in slow, even pulses. Something in there is listening."
  ln_charlotte:
    name: CHARLOTTE (I-77)
    region: lake_norman
    x: 33
    y: 14
    unlocked_if: {flag: chapter2}
    goto: lake_norman
    travel_text: "South on I-77. The skyline comes up dark at the top, the way you left it."
    blurb: "Back to the city map."
links:
  - [south_end, uptown]
  - [south_end, dilworth]
  - [dilworth, plaza_midwood]
  - [plaza_midwood, central_ave]
  - [central_ave, uptown]
  - [plaza_midwood, noda]
  - [noda, blue_line]
  - [blue_line, uptown]
  - [noda, speedway]
  - [uptown, lake_norman]
  - [ln_shore, cornelius]
  - [cornelius, davidson]
  - [cornelius, mooresville]
  - [cornelius, the_islands]
  - [the_islands, state_park]
  - [the_islands, mcguire]
  - [ln_shore, mcguire]
  - [davidson, ln_charlotte]
